[project]
name = "pca-proyecto-scipy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lucía Cervantes", email = "lucia.cervantes@ib.edu.ar" }
]
requires-python = ">=3.15"
dependencies = [
    "argparse>=1.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "scipy>=1.18.1",
]

[project.scripts]
pca-proyecto-scipy = "pca_proyecto_scipy:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
